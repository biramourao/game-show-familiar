<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Show Familiar - Painel do Apresentador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="app" class="control-app">
    <header class="header">
      <h1 class="title">🎛️ Apresentador</h1>
      <div id="connection-status" class="status-indicator status-disconnected">Desconectado</div>
    </header>

    <main id="control-panel" class="control-panel hidden">
      <section class="controls-section-wrapper">
        <div class="theme-select-row">
          <select id="theme-select" class="theme-select" aria-label="Selecionar tema">
            <option value="">Carregando temas...</option>
          </select>
        </div>
        <div class="controls-section">
          <button id="btn-start-round" class="btn btn-primary">▶️ Nova Rodada</button>
          <button id="btn-end-round" class="btn btn-danger" disabled>⏹️ Encerrar</button>
        </div>
      </section>

      <section id="game-info" class="game-info">
        <div id="round-info" class="round-info">Aguardando início da rodada...</div>
        <div id="secret-word-display" class="secret-word-display"></div>
      </section>

      <section id="grid-preview" class="grid-preview">
        <h3 class="section-title">Escolha o número</h3>
        <div id="mini-grid" class="mini-grid"></div>
      </section>

      <section id="clue-controls" class="clue-controls">
        <h3 class="section-title">Liberar pistas</h3>
        <div class="clue-buttons">
          <button id="btn-clue-1" class="btn btn-small" disabled>Pista 1</button>
          <button id="btn-clue-2" class="btn btn-small" disabled>Pista 2</button>
          <button id="btn-clue-3" class="btn btn-small" disabled>Pista 3</button>
        </div>
        <div class="clue-status" id="clue-status">
          <span class="clue-dot"></span>
          <span class="clue-dot"></span>
          <span class="clue-dot"></span>
        </div>
      </section>

      <section id="reveal-controls" class="reveal-controls">
        <h3 class="section-title">Palavra secreta</h3>
        <div id="secret-word-control-display" class="secret-word-control"></div>
        <button id="btn-reveal-word" class="btn btn-warning" disabled>👁️ Mostrar palavra na TV</button>
      </section>

      <section id="answer-controls" class="answer-controls">
        <h3 class="section-title">Acertou?</h3>
        <div class="answer-buttons">
          <button id="btn-score-a" class="btn btn-success" disabled>Equipe A</button>
          <button id="btn-score-b" class="btn btn-success" disabled>Equipe B</button>
        </div>
        <button id="btn-skip" class="btn btn-warning" disabled>❌ Ninguém acertou</button>
        <div class="next-word-row">
          <button id="btn-next-word" class="btn btn-primary" disabled>➡️ Próxima palavra</button>
        </div>
      </section>

      <section id="turn-controls" class="turn-controls">
        <div id="current-turn-display" class="turn-display">Aguardando início...</div>
        <button id="btn-next-turn" class="btn btn-secondary" disabled>🔄 Passar a vez</button>
      </section>
    </main>

    <section id="waiting-screen" class="waiting-screen">
      <div class="waiting-lights">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <p>Conectando ao jogo...</p>
    </section>

    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/controle.js"></script>
</body>
</html>
