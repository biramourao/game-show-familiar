<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Show Familiar - Tela Principal</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="title">🎮 GAME SHOW FAMILIAR</h1>
      <div id="connection-status" class="status-indicator status-disconnected">⚪ Desconectado</div>
    </header>

    <section id="scoreboard" class="scoreboard hidden">
      <div class="team team-a">
        <h2 class="team-name">Equipe A</h2>
        <div id="score-a" class="score">0</div>
      </div>
      <div class="turn-indicator" id="turn-display">🟢 Vez da Equipe A</div>
      <div class="team team-b">
        <h2 class="team-name">Equipe B</h2>
        <div id="score-b" class="score">0</div>
      </div>
    </section>

    <main id="game-area" class="game-area hidden">
      <div id="theme-display" class="theme-display"></div>

      <div id="number-grid" class="number-grid">
        <!-- Grid will be generated by JS -->
      </div>

      <section id="clues-section" class="clues-section hidden">
        <h3 class="section-title">🔍 PISTAS:</h3>
        <div class="clue clue-1" id="clue-1">
          <span class="clue-label">Pista 1:</span>
          <span class="clue-text">Aguardando...</span>
        </div>
        <div class="clue clue-2 hidden" id="clue-2">
          <span class="clue-label">Pista 2:</span>
          <span class="clue-text">Bloqueada</span>
        </div>
        <div class="clue clue-3 hidden" id="clue-3">
          <span class="clue-label">Pista 3:</span>
          <span class="clue-text">Bloqueada</span>
        </div>
      </section>

      <section id="word-section" class="word-section hidden">
        <h3 class="section-title">🎯 PALAVRA:</h3>
        <div id="secret-word" class="secret-word"></div>
      </section>

      <section id="end-screen" class="end-screen hidden">
        <h2 id="winner-display"></h2>
        <div id="final-scores" class="final-scores"></div>
      </section>
    </main>

    <section id="waiting-screen" class="waiting-screen">
      <p>Aguardando o apresentador iniciar a rodada...</p>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/tv.js"></script>
</body>
</html>
